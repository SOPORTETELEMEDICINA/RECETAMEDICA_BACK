<!DOCTYPE html>
<html lang='es'>

<head>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<meta charset='utf-8'>
</head>
<title>Notas de seguridad (AEMPS)</title>
<style>
	#nsec {
		width: 100%;
		max-width: 900px;
		margin-left: auto;
		margin-right: auto;
		padding: 2px;
		list-style: none;
		font-family: Helvetica, Arial, sans-serif
	}

		#nsec li {
			border-bottom: 1px solid #ddd
		}

		#nsec .name .co {
			font-size: 14px;
			color: #11436d;
			cursor: pointer
		}

			#nsec .name .co:hover {
				text-decoration: underline
			}

		#nsec .name .de {
			content: '\2022';
			color: #11436d;
			font-size: 24px;
			margin-right: 4px;
			position: relative;
			top: 2px
		}

		#nsec .cn {
			font-size: 13px;
			margin-top: 4px;
			color: #38659c
		}

		#nsec .dt {
			margin-bottom: 8px
		}

		#nsec .fi {
			font-size: 11px;
			margin-top: 4px;
			color: #38659c;
			text-align: right;
			margin-bottom 4px;
			color: #212121
		}

		#nsec .ob {
			font-size: 13px;
			margin-top: 8px;
			margin-bottom: 4px;
			color: #940202;
			text-align: left;
			margin-bottom 4px
		}

	.modal {
		display: none;
		position: fixed;
		z-index: 1;
		padding-top: 15px;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		overflow: auto
	}

	.modal-content {
		background-color: #fff;
		margin: auto;
		padding: 0;
		border: 1px solid #ddd;
		width: calc(100% - 2px);
		max-width: 750px;
		height: calc(100vh - 3px);
		overflow-y: auto;
		overflow-x: hidden;
		margin-top: -15px
	}

		.modal-content #informacion a {
			color: #11436d
		}

		.modal-content #informacion {
			font-family: Helvetica, Arial, sans-serif;
			padding: 40px;
			font-size: 13px;
			width: calc(100% - 80px);
			height: calc(100vh - 70px);
			max-width: 700px;
			margin-left: auto;
			margin-right: auto;
			padding-top: 0 !important;
			overflow-y: none !important;
			margin-top: 0 !important
		}

	.close {
		color: #aaa;
		float: right;
		font-size: 28px;
		font-weight: bold;
		margin-right: 10px;
		font-size: 2.6rem
	}

		.close:hover,
		.close:focus {
			color: #000;
			text-decoration: none;
			cursor: pointer
		}

	.trobber {
		text-align: center
	}

		.trobber img {
			background: #fff;
			padding: 20px;
			margin-top: calc(100vh - 600px)
		}

	.bshadow {
		-webkit-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
		-moz-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
		box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important
	}
</style>

<body>
	{contenidoAlertas}
	<div id='myModal' class='modal'>
		<div class='modal-content bshadow'>
			<span onClick='modal.style.display ="none"' class='close'>&times;</span>
			<div id='modalContent'></div>
		</div>
	</div>
	<script>
		var modal = document.getElementById("myModal"); function show_modal(e) { document.getElementById("modalContent").innerHTML = "<div class=\"trobber\"><img  src=\"../images/throbber.gif\"></div>", modal.style.display = "block", loadDoc(e) } function loadDoc(e) { var t = new XMLHttpRequest; t.onreadystatechange = function () { 4 == this.readyState && 200 == this.status && (document.getElementById("modalContent").innerHTML = this.responseText, document.querySelectorAll("#informacion#canalesCompartir").remove()) }, t.open("GET", "/get_alerts_tool/getNSecHTML?url=" + e, !0), t.send() } window.onclick = function (e) { e.target == modal && (modal.style.display = "none") };
	</script>
</body>

</html>
