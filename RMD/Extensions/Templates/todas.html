<!DOCTYPE html>
<html lang='es'>

<head>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<meta charset='UTF-8'>
</head>
<title>Fuentes Vademecun(problemasSuministros,notasSeguridad,vademecumNoticias,vademecumPAs)</title>

<body>
	<style>
		body {
			font-family: Helvetica, Arial, sans-serif;
		}

		.section_header {
			border: 1px solid #ddd;
			padding: 10px;
			font-weight: bold;
			font-size: 24px;
			background: #eaeaea;
			width: calc(100% - 25px);
			max-width: 900px;
			margin-left: auto;
			margin-right: auto
		}
	</style>
	<div class='section_header'>Problemas de suministros</div>
	<style>
		#psum {
			width: 100%;
			max-width: 900px;
			margin-left: auto;
			margin-right: auto;
			padding: 2px;
			list-style: none;
			font-family: Helvetica, Arial, sans-serif
		}

			#psum li {
				border-bottom: 1px solid #ddd
			}

			#psum .name .co {
				font-size: 14px;
				color: #11436d;
				cursor: pointer
			}

				#psum .name .co:hover {
					text-decoration: underline
				}

			#psum .name .de {
				content: '\2022';
				color: #11436d;
				font-size: 24px;
				margin-right: 4px;
				position: relative;
				top: 2px
			}

			#psum .cn {
				font-size: 13px;
				margin-top: 4px;
				color: #38659c
			}

			#psum .dt {
				margin-bottom: 8px
			}

			#psum .fi {
				font-size: 11px;
				margin-top: 4px;
				color: #38659c;
				text-align: right;
				margin-bottom 4px;
				color: #212121
			}

			#psum .ob {
				font-size: 13px;
				margin-top: 8px;
				margin-bottom: 4px;
				color: #940202;
				text-align: left;
				margin-bottom 4px
			}
	</style>
	<ul id='psum'>
		{contenidoSuministros}
	</ul>

			}

					text-decoration: underline

			#nsec .name .de {
				content: '\2022';
				color: #11436d;

				top: 2px
			}

			#nsec .cn {
				font-size: 13px;

			#nsec .dt {

			}

			#nsec .fi {

				color: #38659c;

			}

			#nsec .ob {
				font-size: 13px;
				margin-top: 8px;
				margin-bottom: 4px;
				color: #940202;
				text-align: left;
				margin-bottom 4px
			}

		.modal {
			display: none;
			position: fixed;
			z-index: 1;
			padding-top: 15px;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			overflow: auto
		}

		.modal-content {
			background-color: #fff;
			margin: auto;
			padding: 0;
			border: 1px solid #ddd;
			width: calc(100% - 60px);
			max-width: 750px;
			height: calc(100vh - 30px);
			overflow-y: auto
		}

			.modal-content #informacion a {
				color: #11436d;
			}

			.modal-content #informacion {
				font-family: Helvetica, Arial, sans-serif;
				padding: 40px;
				font-size: 13px;
				width: calc(100% - 80px);
				height: calc(100vh - 70px);
				max-width: 700px;
				margin-left: auto;
				margin-right: auto;
				padding-top: 0 !important;
				overflow-y: none !important;
				margin-top: 0px !important
			}

		.close {
			color: #aaa;
			float: right;
			font-size: 28px;
			font-weight: bold
		}

			.close:hover,
			.close:focus {
				color: #000;
				text-decoration: none;
				cursor: pointer
			}

		.trobber {
			text-align: center
		}

			.trobber img {
				background: #fff;
				padding: 20px;
				margin-top: calc(100vh - 600px)
			}

		.bshadow {
			-webkit-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
			-moz-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
			box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important
		}
	</style>
	<ul id='nsec'>
		{contenidoSeguridad}
	</ul>
	<div class='section_header'>Vademecum - Noticias</div>
	<style>
		#vad_noticias {
			width: 100%;
			max-width: 900px;
			padding: 0px;
			margin-left: auto;
			margin-right: auto;
		}

			#vad_noticias li {
				border-bottom: 1px solid #ddd !important;
				display: flex;
				padding: 5px;
				border-left: 1px solid #fff;
				border-right: 1px solid #fff;
				cursor: pointer
			}

				#vad_noticias li:hover {
					background: #f0f0f0;
					border-left: 1px solid #ddd;
					border-right: 1px solid #ddd;
					padding: 5px
				}

				#vad_noticias li .si {
					float: left;
					width: 150px;
					display: grid;
					padding-top: 5px;
					padding-bottom: 5px
				}

					#vad_noticias li .si img {
						width: calc(100% - 25px);
						margin-left: auto;
						margin-right: auto;
						height: 100%;
						border: 1px solid #38659c;
						border-radius: .30rem;
						max-height: 95px;
						min-height: 95px;
						-webkit-box-shadow: 2px 2px 5px 0px rgba(0, 0, 0, 0.36);
						-moz-box-shadow: 2px 2px 5px 0px rgba(0, 0, 0, 0.36);
						box-shadow: 2px 2px 5px 0px rgba(0, 0, 0, 0.36);
					}

				#vad_noticias li .sd {
					float: right;
					width: calc(100% - 100px)
				}

					#vad_noticias li .sd .til {
						font-size: 14px;
						color: #11436d;
						cursor: pointer;
						margin-top: 5px;
						margin-bottom: 5px;
						font-weight: bold
					}

						#vad_noticias li .sd .til span {
							font-size: 20px;
							margin-right: 4px;
							position: relative;
							top: 2px
						}

					#vad_noticias li .sd .bre {
						font-size: 12px;
						color: #4d4d4d;
						cursor: pointer;
						text-align: justify;
						margin-top: 5px;
						margin-bottom: 5px;
						min-height: 25px;
						padding: 4px
					}

					#vad_noticias li .sd .pub {
						height: 17px;
						margin-right: 5px;
						text-align: left;
						font-size: 12px;
						margin-top: 10px;
						color: #38659c;
						font-style: italic
					}

						#vad_noticias li .sd .pub .cat {
							color: #aaa;
							font-weight: bold
						}

		@media only screen and (max-width:525px) {
			#vad_noticias li {
				border-bottom: 1px solid #ddd !important;
				display: grid
			}

				#vad_noticias li .si {
					width: 100%
				}

				#vad_noticias li .sd {
					width: 100%
				}

					#vad_noticias li .sd .til {
						margin: 5px
					}

					#vad_noticias li .sd .bre {
						margin: 5px;
						margin-top: 10px
					}

					#vad_noticias li .sd .pub {
						margin-left: 5px
					}

						#vad_noticias li .sd .pub .cat {
							color: #aaa;
							font-weight: bold
						}

				#vad_noticias li .si img {
					max-height: 125px;
					min-height: 125px;
				}
		}

		.modal {
			display: none;
			position: fixed;
			z-index: 1;
			padding: 0px;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			overflow: auto;
			background: #00000054;
		}

		.modal-content {
			background-color: #fff;
			margin: auto;
			padding: 0;
			border-radius: 0.35rem;
			border: 1px solid #ddd;
			width: calc(100% - 30px);
			max-width: 625px;
			height: calc(100% - 23px);
			margin-top: 7px;
			overflow-y: auto
		}

			.modal-content #informacion a {
				color: #11436d
			}

			.modal-content #informacion {

				max-width: 700px;
				margin-left: auto;
				margin-right: auto;
				padding-top: 0 !important;
				overflow-y: none !important;
				margin-top: 0 !important
			}

		.close {
			color: #aaa;
			float: right;
			font-size: 28px;
			font-weight: bold
		}

			.close:hover,
			.close:focus {
				color: #000;
				text-decoration: none;
				cursor: pointer
			}

		.trobber {
			text-align: center
		}

			.trobber img {
				background: #fff;
				padding: 20px;
				margin-top: calc(100vh - 600px)
			}

		.bshadow {
			-webkit-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
			-moz-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
			box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important
		}
	</style>
	<ul id='vad_noticias'>
		{contenidoNoticias}
	</ul>
