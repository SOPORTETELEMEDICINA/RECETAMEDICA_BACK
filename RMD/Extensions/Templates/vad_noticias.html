<head>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<meta charset='UTF-8'>
</head>
<title>Noticias (Vademecum)</title>
<style>
	body {
		font-family: Helvetica Neue, Helvetica, Roboto, Arial, sans-serif;
		padding: 0 !important;
		margin: 0 !important
	}

	#vad_noticias {
		width: 100%;
		max-width: 750px;
		margin-left: auto;
		margin-right: auto;
		padding: 2px;
		list-style: none;
		font-family: Helvetica, Arial, sans-serif
	}

		#vad_noticias li {
			border-bottom: 1px solid #ddd !important;
			display: flex;
			padding: 5px;
			border-left: 1px solid #fff;
			border-right: 1px solid #fff;
			cursor: pointer
		}

			#vad_noticias li:hover {
				background: #f0f0f0;
				border-left: 1px solid #ddd;
				border-right: 1px solid #ddd;
				padding: 5px
			}

			#vad_noticias li .si {
				float: left;
				width: 125px;
				display: grid;
				padding-top: 5px;
				padding-bottom: 5px
			}

				#vad_noticias li .si img {
					width: calc(100% - 10px);
					margin-left: auto;
					margin-right: auto;
					border: 1px solid #38659c;
					border-radius: .30rem;
					-webkit-box-shadow: 2px 2px 5px 0 rgba(0, 0, 0, 0.36);
					-moz-box-shadow: 2px 2px 5px 0 rgba(0, 0, 0, 0.36);
					box-shadow: 2px 2px 5px 0 rgba(0, 0, 0, 0.36)
				}

			#vad_noticias li .sd {
				float: right;
				width: calc(100% - 100px)
			}

				#vad_noticias li .sd .til {
					font-size: 14px;
					color: #11436d;
					cursor: pointer;
					margin-left: 10px;
					margin-top: 5px;
					margin-bottom: 5px;
					font-weight: bold
				}

					#vad_noticias li .sd .til span {
						font-size: 20px;
						margin-right: 4px;
						position: relative;
						top: 2px
					}

				#vad_noticias li .sd .bre {
					font-size: 12px;
					color: #4d4d4d;
					cursor: pointer;
					margin-left: 10px;
					text-align: justify;
					margin-top: 5px;
					margin-bottom: 5px;
					min-height: 25px;
					padding: 4px
				}

				#vad_noticias li .sd .pub {
					height: 17px;
					margin-right: 5px;
					text-align: left;
					font-size: 12px;
					margin-left: 10px;
					margin-top: 10px;
					color: #38659c;
					font-style: italic
				}

					#vad_noticias li .sd .pub .cat {
						color: #aaa;
						font-weight: bold
					}

	@media only screen and (max-width:375px) {
		#vad_noticias li {
			border-bottom: 1px solid #ddd !important;
			display: grid
		}

			#vad_noticias li .si {
				width: 100%
			}

			#vad_noticias li .sd {
				width: 100%
			}

				#vad_noticias li .sd .til {
					margin: 5px
				}

				#vad_noticias li .sd .bre {
					margin: 5px;
					margin-top: 10px
				}

				#vad_noticias li .sd .pub {
					margin-left: 5px
				}

					#vad_noticias li .sd .pub .cat {
						color: #aaa;
						font-weight: bold
					}
	}

	.modal {
		display: none;
		position: fixed;
		z-index: 1;
		padding: 0;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		overflow: auto;
		background: #00000054
	}

	.modal-content {
		background-color: #fff;
		margin: auto;
		padding: 0;
		border: 1px solid #ddd;
		width: calc(100% - 2px);
		max-width: 625px;
		height: calc(100% - 2px);
		overflow-y: auto;
		overflow-x: hidden
	}

		.modal-content #informacion a {
			color: #11436d
		}

		.modal-content #informacion {
			font-family: Helvetica, Arial, sans-serif;
			padding: 40px;
			font-size: 13px;
			width: calc(100% - 80px);
			height: calc(100vh - 70px);
			max-width: 700px;
			margin-left: auto;
			margin-right: auto;
			padding-top: 0 !important;
			overflow-y: none !important;
			margin-top: 0 !important
		}

	.close {
		color: #aaa;
		float: right;
		font-size: 28px;
		font-weight: bold;
		margin-right: 10px;
		font-size: 2.6rem
	}

		.close:hover,
		.close:focus {
			color: #000;
			text-decoration: none;
			cursor: pointer
		}

	.trobber {
		text-align: center
	}

		.trobber img {
			background: #fff;
			padding: 20px;
			margin-top: calc(100vh - 600px)
		}

	.bshadow {
		-webkit-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
		-moz-box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important;
		box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.15) !important
	}
</style>
{contenidoAlertas}
