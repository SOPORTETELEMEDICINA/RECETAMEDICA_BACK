<!DOCTYPE html>
<html lang='es'>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=UTF-8'>

<title>Problemas de suministros (AEMPS)</title>

<body>
    <style>
        #psum {
            width: 100%;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            padding: 2px;
            list-style: none;
            font-family: Helvetica, Arial, sans-serif
        }

            #psum li {
                border-bottom: 1px solid #ddd
            }

            #psum .name .co {
                font-size: 14px;
                color: #11436d;
                cursor: pointer
            }

                #psum .name .co:hover {
                    text-decoration: underline
                }

            #psum .name .de {
                content: '\2022';
                color: #11436d;
                font-size: 24px;
                margin-right: 4px;
                position: relative;
                top: 2px
            }

            #psum .cn {
                font-size: 13px;
                margin-top: 4px;
                color: #38659c
            }

            #psum .dt {
                margin-bottom: 8px
            }

            #psum .fi {
                font-size: 11px;
                margin-top: 4px;
                color: #38659c;
                text-align: right;
                margin-bottom 4px;
                color: #212121
            }

            #psum .ob {
                font-size: 13px;
                margin-top: 8px;
                margin-bottom: 4px;
                color: #940202;
                text-align: left;
                margin-bottom 4px
            }
    </style>
{contenidoAlertas}
